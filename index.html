<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Short Buy सेलर</title><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><style>

hr{border:0;border-top:1px dashed #9aa9a6}</style></head><body>
<header><h1><a href="index.html" style="color:inherit;text-decoration:none">🏪 Short Buy सेलर</a></h1><button class="sm" onclick="supportUI()">🆘 सपोर्ट</button><button id="lb" class="sm">लॉगिन</button></header>

<script>
const firebaseConfig={apiKey:"AIzaSyCkblGm-Esda5VbOZYkpQpHsBePhxen8hk",authDomain:"psb-chtting.firebaseapp.com",projectId:"psb-chtting",storageBucket:"psb-chtting.firebasestorage.app",messagingSenderId:"689058791105",appId:"1:689058791105:web:e8a528524c004546415e40",measurementId:"G-F6VW5EGSHL"};
firebase.initializeApp(firebaseConfig);

async function pinFill(p){const z=$('#'+p+'pin').value.trim();if(!/^\d{6}$/.test(z))return;
try{const r=await(await fetch('https://api.postalpincode.in/pincode/'+z)).json(),o=r[0]?.PostOffice?.[0];
if(o){$('#'+p+'st').value=o.State;$('#'+p+'di').value=o.District;if(!$('#'+p+'ci').value)$('#'+p+'ci').value=o.Block&&o.Block!='NA'?o.Block:o.District}}catch(e){}}
function readAddr(p,m=1){const g=k=>$('#'+p+k)?.value.trim()||'';const a={n:g('n'),ph:g('ph'),pin:g('pin'),vi:g('vi'),ci:g('ci'),st:g('st'),di:g('di')};
if((m&&(!a.n||!/^\d{10}$/.test(a.ph)))||!/^\d{6}$/.test(a.pin)||!a.ci||!a.st||!a.di){alert('पूरा पता भरें: '+(m?'नाम, 10 अंक का मोबाइल, ':'')+'6 अंक का पिन कोड, शहर, राज्य और जिला');return null}return a}
const CATS=['कपड़े','जूते-चप्पल','इलेक्ट्रॉनिक्स','घर व किचन','सौंदर्य','बच्चों का सामान','अन्य'];
const TABS=[['p','⏳ Pending'],['c','❌ Cancel'],['d','🚚 Dispatch'],['e','💰 कमाई'],['m','📦 प्रोडक्ट'],['g','🎁 गिफ्ट कार्ड'],['r','🧾 रसीदें']];
async function checkBan(){BAN=null;if(!auth.currentUser)return false;
const d=await db.collection('bans').where('uid','==',auth.currentUser.uid).where('expiryTime','>',firebase.firestore.Timestamp.now()).limit(1).get();
if(!d.empty){BAN=d.docs[0].data();sheet('🚫 बैन','<div style="color:#dc2626;text-align:center"><b>आप इस ऐप पर बैन हैं</b><p>कारण: '+esc(BAN.reason)+'</p><p>बैन ख़त्म होगा: '+new Date(BAN.expiryTime.toDate()).toLocaleString('hi-IN')+'</p><button onclick="supportUI()">सपोर्ट से संपर्क करें</button></div>');return true}
return false}
async function startSession(){const u=auth.currentUser;if(!u||await checkBan())return;
const d={uid:u.uid,type:'seller',startTime:firebase.firestore.FieldValue.serverTimestamp(),lastActivity:firebase.firestore.FieldValue.serverTimestamp()};
const r=await db.collection('sessions').add(d);SID=r.id;
setInterval(()=>{if(SID&&auth.currentUser)db.collection('sessions').doc(SID).update({lastActivity:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{})},30000)}
function endSession(){if(SID)db.collection('sessions').doc(SID).delete().catch(()=>{});SID=null}
let U=null,S0=null,tab='p',un=[],OR=[],PR=[],RC=[],GC=[],IM=[],SID=null,BAN=null;
const GS={pending:'⏳ एडमिन की मंजूरी बाकी',active:'✅ चालू',rejected:'❌ एडमिन ने रिजेक्ट किया',disabled:'🚫 बंद कर दिया गया',used:'✅ पूरा इस्तेमाल हो गया'};
window.addEventListener('beforeunload',endSession);
const LOG=t=>({t:Date.now(),text:t});
$('#ra').innerHTML=addrHTML('s',{},0);
$('#lb').onclick=()=>U?(endSession(),auth.signOut()):login();
auth.onAuthStateChanged(async u=>{U=u;un.forEach(f=>f());un=[];S0=null;
['#gate','#reg','#app'].forEach(i=>$(i).hidden=true);$('#lb').textContent=u?'लॉगआउट':'लॉगिन';
if(!u){endSession();$('#gate').hidden=false;return}
if(await checkBan()){$('#gate').hidden=false;return}
startSession();
try{const d=await db.collection('sellers').doc(u.uid).get();S0=d.exists?d.data():null}catch(e){alert('लोड नहीं हुआ: '+e.message)}
if(!S0){$('#reg').hidden=false;return}
$('#app').hidden=false;watch()});
async function reg(){
const shop=$('#rsh').value.trim(),mb=$('#rmb').value.trim(),ac=$('#rac').value.trim(),ifsc=$('#rif').value.trim().toUpperCase();
if(!shop||!/^\d{10}$/.test(mb))return alert('दुकान का नाम और 10 अंक का मोबाइल नंबर भरें');
const a=readAddr('s',0);if(!a)return;
if(!/^\d{9,18}$/.test(ac)||!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc))return alert('सही A/c नंबर और IFSC कोड भरें');
const d={uid:U.uid,email:U.email,gname:U.displayName||'',shop,mobile:mb,addr:a,addrText:fmt(a),acc:ac,ifsc,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
try{await db.collection('sellers').doc(U.uid).set(d);S0=d;$('#reg').hidden=true;$('#app').hidden=false;watch()}catch(e){alert('खाता नहीं बना: '+e.message)}}
function watch(){un.push(
db.collection('products').where('sellerId','==',U.uid).onSnapshot(s=>{PR=arr(s);draw()}),
db.collection('orders').where('sellerIds','array-contains',U.uid).onSnapshot(s=>{OR=arr(s);draw()}),
db.collection('receipts').where('sellerId','==',U.uid).onSnapshot(s=>{RC=arr(s);draw()}),
db.collection('giftCards').where('sellerId','==',U.uid).onSnapshot(s=>{GC=arr(s);draw()}));draw()}
const my=o=>o.items.filter(i=>i.sellerId==U.uid);
const amt=o=>my(o).reduce((a,i)=>a+(i.sp??i.price)*i.qty,0);
const sum=a=>a.reduce((x,o)=>x+amt(o),0);
const nm=o=>my(o).map(i=>esc(i.name)+(i.size?' ['+esc(i.size)+']':'')+' ×'+i.qty).join(', ');
const isP=o=>o.sellerState=='pending'&&o.status!='रद्द',isC=o=>o.status=='रद्द',isD=o=>!isP(o)&&!isC(o)&&o.sellerState!='rejected';
const oc=(o,x)=>`<div class="box"><b>${nm(o)}</b><span class="tag">${ts(o.createdAt)} · ${rs(amt(o))}</span>${x}</div>`;
const dc=o=>{const it=my(o)[0]||{},p=PR.find(x=>x.id==it.id)||{};
return `<div class="box"><div class="row" style="align-items:flex-start"><img class="pv" src="${esc(imgs(p)[0])}" alt=""><span style="flex:1"><b>${esc(it.name)}</b> ×${it.qty}<br><span class="tag">${esc(p.cat)} · रंग: ${esc(p.color||'-')}${it.size?' · साइज़: '+esc(it.size):''}${p.dim?.v?' · आकार: '+esc(p.dim.v)+' '+esc(p.dim.u):''}${p.wt?.v?' · वजन: '+esc(p.wt.v)+' '+esc(p.wt.u):''}</span><br><span>${esc(p.desc)}</span></span></div><b>${rs(amt(o))}</b><span class="tag">ऑर्डर #${o.id.slice(-6).toUpperCase()} · ${ts(o.createdAt)}</span>${tl(o)}${o.awb?`<span class="tag">🚚 AWB: <b>${esc(o.awb)}</b></span>`:''}${o.retStatus?`<span class="tag">↩️ रिटर्न: ${o.retStatus=='requested'?'ग्राहक ने रिटर्न माँगा है':o.retStatus=='pickup'?'सामान वापस पिकअप हो गया, रिफंड बाकी':'✅ रिफंड ग्राहक को भेज दिया गया'}</span>`:''}${o.labelReady?`<button onclick="dl('${o.id}')">⬇️ रसीद डाउनलोड करें</button>`:'<span class="tag">⏳ रसीद एडमिन की तरफ से आनी बाकी है</span>'}</div>`};
function draw(){if(!U||!S0)return;
const n={p:OR.filter(isP).length,c:OR.filter(isC).length,d:OR.filter(isD).length};
$('#tb').innerHTML=TABS.map(([k,t])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';draw()">${t}${n[k]!=null?' ('+n[k]+')':''}</button>`).join('');
const E=OR.filter(isD),pd=E.filter(o=>o.payStatus!='paid'),pa=E.filter(o=>o.payStatus=='paid');
const V={
p:()=>OR.filter(isP).map(o=>oc(o,`<div class="row"><button class="r" onclick="rej('${o.id}')">❌ अस्वीकार</button><button onclick="acc('${o.id}')">✅ स्वीकार</button></div>`)).join('')||'कोई Pending ऑर्डर नहीं',
c:()=>OR.filter(isC).map(o=>oc(o,`<b>❌ ${o.cancelledBy=='user'?'ग्राहक ने रद्द किया':o.cancelledBy=='seller'?'आपने रद्द किया':'रद्द हुआ'}</b>`)).join('')||'कोई रद्द ऑर्डर नहीं',
d:()=>OR.filter(isD).map(dc).join('')||'कोई Dispatch ऑर्डर नहीं',
e:()=>`<div class="box"><b>⏳ अभी नहीं मिला: ${rs(sum(pd))}</b>${pd.map(o=>`<div class="row"><span>${nm(o)}<br><span class="tag">${esc(o.status)}</span></span><b>${rs(amt(o))}</b></div>`).join('')||'कुछ नहीं'}</div><div class="box"><b>✅ पैसे मिल गए: ${rs(sum(pa))}</b>${pa.map(o=>`<div class="row"><span>${nm(o)}<br><span class="tag">UTR: ${esc(o.utr)}</span></span><b>${rs(amt(o))}</b></div>`).join('')||'कुछ नहीं'}</div>`,
m:()=>PR.map(p=>`<div class="box"><div class="row"><img class="pv" style="width:56px" src="${esc(imgs(p)[0])}" alt=""><span style="flex:1">${esc(p.name)} — ${rs(p.price)}${p.ratingCount?` · ⭐ ${(p.ratingSum/p.ratingCount).toFixed(1)} (${p.ratingCount})`:''}<br><span class="tag">स्टॉक ${p.stock} · बिका ${p.sold||0} · ${p.public?(p.approved?'🌐 Public (शॉप में लाइव)':'⏳ एडमिन की मंजूरी बाकी'):'🔒 Private'}</span></span></div><div class="row"><input id="add_${p.id}" type="number" placeholder="जितना स्टॉक जोड़ना है"><button class="sm" onclick="addStock('${p.id}')">➕ स्टॉक जोड़ें</button></div><div class="row"><button class="sm" onclick="tgp('${p.id}',${!p.public})">${p.public?'Private करें':'Public करें'}</button><button class="sm r" onclick="delP('${p.id}')">हटाएँ</button></div></div>`).join('')||'अभी कोई प्रोडक्ट नहीं — नीचे + दबाकर जोड़ें',
r:()=>RC.map(r=>`<div class="box"><b>🧾 डिलीवरी रसीद · ${ts(r.createdAt)}</b><span>${r.items.map(x=>esc(x.name)+' ×'+x.qty).join(', ')}</span><span class="tag">ग्राहक: ${esc(r.customer)}</span><b>${rs(r.amount)}</b></div>`).join('')||'अभी कोई रसीद नहीं आई',
g:()=>`<div class="box"><b>🎁 गिफ्ट कार्ड के लिए उपलब्ध वॉलेट: ${rs(gcAvail())}</b><span class="tag">यह आपके पेंडिंग पेमेंट (${rs(sum(pd))}) में से निकलता है — गिफ्ट कार्ड बनाते ही उतना पेंडिंग पेमेंट से घट जाएगा</span></div>
<div class="box col"><b>नया गिफ्ट कार्ड बनाएँ</b><input id="ga" type="number" placeholder="रकम (₹)"><input id="gn" placeholder="जिसे भेजना है — उसका नाम"><input id="gp" type="tel" placeholder="उसका WhatsApp मोबाइल नंबर"><input id="gad" placeholder="उसका पता"><textarea id="gm" rows="2" placeholder="मेसेज (वैकल्पिक)"></textarea><button onclick="gcSend()">एडमिन को मंजूरी के लिए भेजें</button></div>
${GC.map(g=>`<div class="box"><b>${rs(g.amount)}</b> <span class="tag">${GS[g.status]||g.status}</span>${g.status=='active'||g.status=='used'?`<span class="tag">बाकी बैलेंस: ${rs(g.balance)}</span><div class="row"><code style="flex:1;word-break:break-all">${esc(g.id)}</code><button class="sm" onclick="gcCopy('${g.id}')">📋 कॉपी</button></div>`:''}${g.recipientName?`<span class="tag">भेजा: ${esc(g.recipientName)} · ${esc(g.recipientPhone)}${g.recipientAddress?' · '+esc(g.recipientAddress):''}</span>`:''}${g.status=='rejected'&&g.rejectReason?`<span class="tag">कारण: ${esc(g.rejectReason)}</span>`:''}<span class="tag">${ts(g.createdAt)}</span></div>`).join('')||'अभी कोई गिफ्ट कार्ड नहीं बनाया'}`};
$('#v').innerHTML=V[tab]()}
function acc(id){db.collection('orders').doc(id).update({sellerState:'accepted',log:firebase.firestore.FieldValue.arrayUnion(LOG('सेलर ने ऑर्डर स्वीकार किया'))}).catch(e=>alert('नहीं हुआ: '+e.message))}
async function rej(id){if(!confirm('यह ऑर्डर अस्वीकार करें?'))return;const o=OR.find(x=>x.id==id),r=db.collection('orders').doc(id),u={sellerState:'rejected',status:'रद्द',cancelledBy:'seller',log:firebase.firestore.FieldValue.arrayUnion(LOG('सेलर ने ऑर्डर अस्वीकार किया'))};
try{const b=db.batch();b.update(r,u);my(o).forEach(i=>b.update(db.collection('products').doc(i.id),{sold:firebase.firestore.FieldValue.increment(-i.qty),lastOrderId:id}));await b.commit()}
catch(e){try{await r.update(u)}catch(e2){alert(e2.message)}}}
async function dl(id){try{const d=await db.collection('labels').doc(id).get();if(!d.exists)return alert('रसीद अभी उपलब्ध नहीं है');
const b=atob(d.data().pdf.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));a.download='receipt-'+id.slice(-6).toUpperCase()+'.pdf';document.body.appendChild(a);a.click();a.remove()}catch(e){alert('डाउनलोड नहीं हुआ: '+e.message)}}
function tgp(id,v){db.collection('products').doc(id).update({public:v}).catch(e=>alert(e.message))}
function gcAvail(){const pd=OR.filter(isD).filter(o=>o.payStatus!='paid'),c=GC.filter(g=>g.status=='pending'||g.status=='active'||g.status=='used').reduce((a,g)=>a+g.amount,0);return Math.max(0,sum(pd)-c)}

function gcCopy(code){(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>alert('कोड कॉपी हो गया ✅')).catch(()=>prompt('इसे कॉपी करें:',code))}
